{% if messages %}
<div class="app-messages">
    {% for message in messages %}
    <div class="alert alert-{{ message.tags|default:'info' }} alert-dismissible fade show app-alert" role="alert">
        {% if message.tags == 'success' %}<i class="fa-solid fa-circle-check"></i>{% endif %}
        {% if message.tags == 'error' %}<i class="fa-solid fa-circle-exclamation"></i>{% endif %}
        {% if message.tags == 'info' %}<i class="fa-solid fa-circle-info"></i>{% endif %}
        {% if message.tags == 'warning' %}<i class="fa-solid fa-triangle-exclamation"></i>{% endif %}
        {{ message }}
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>
    {% endfor %}
</div>
{% endif %}
