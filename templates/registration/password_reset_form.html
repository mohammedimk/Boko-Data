{% extends 'base.html' %}
{% block title %}Reset Password{% endblock %}
{% block auth_content %}
<div class="auth-wrapper">
    <div class="auth-card">
        <div class="auth-brand"><i class="fa-solid fa-bolt"></i> VTU<strong>Hub</strong></div>
        <h4 class="auth-heading">Reset your password</h4>
        <p class="auth-sub">Enter your email address and we'll send you a link to reset your password.</p>
        <form method="post" novalidate>
            {% csrf_token %}
            <div class="mb-3">
                <label class="form-label">Email</label>
                <input type="email" name="email" class="form-control" required>
            </div>
            <button type="submit" class="btn btn-primary w-100 btn-auth">
                <i class="fa-solid fa-paper-plane"></i> Send Reset Link
            </button>
        </form>
        <p class="auth-footer"><a href="{% url 'login' %}">Back to login</a></p>
    </div>
</div>
{% endblock %}
