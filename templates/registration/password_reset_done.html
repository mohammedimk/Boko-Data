{% extends 'base.html' %}
{% block title %}Reset Link Sent{% endblock %}
{% block auth_content %}
<div class="auth-wrapper">
    <div class="auth-card text-center">
        <div class="auth-brand"><i class="fa-solid fa-bolt"></i> VTU<strong>Hub</strong></div>
        <i class="fa-solid fa-envelope-circle-check fa-3x text-success my-3"></i>
        <h4 class="auth-heading">Check your inbox</h4>
        <p class="auth-sub">If an account exists with that email, a password reset link has been sent.</p>
        <a href="{% url 'login' %}" class="btn btn-primary w-100 btn-auth">Back to Login</a>
    </div>
</div>
{% endblock %}
